<!DOCTYPE html>
<html lang="zh-CN">
<head<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>>
<meta charset="UTF-8">
<title>Christmas Face Generator</title>

<style>
body {
    background:#0b3d2e;
    color:white;
    text-align:center;
    font-family:Arial;
}
video, canvas {
    border:3px solid white;
    border-radius:12px;
}
#hint {
    margin-top:12px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>🎄 圣诞老人生成器 🎅</h1>
<p>请将人脸对准画面中央</p>

<video id="video" width="400" height="300" autoplay muted playsinline></video>
<canvas id="canvas" width="400" height="300"></canvas>
<div id="hint">摄像头已启动</div>

<script>
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video:true })
.then(stream=>{
    video.srcObject = stream;
})
.catch(()=>{
    alert("摄像头无法打开");
});
</script>

</body>
</html>
