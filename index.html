<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Camera Test</title>
</head>

<body>
<h1>摄像头测试</h1>

<video id="video" autoplay playsinline></video>

<script>
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    alert("无法打开摄像头");
});
</script>

</body>
</html>
